# Local PostgreSQL service; credentials are supplied through environment variables.
services:
  db:
    image: postgres:17-alpine
    container_name: spcl-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    # Named storage keeps database data when the container is recreated.
    volumes:
      - spcl_postgres_data:/var/lib/postgresql/data

volumes:
  spcl_postgres_data:
