<!doctype html>
<!-- Browser shell: loads fonts and hands rendering to the React entry module. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- viewport-fit=cover lets the technician app pad itself around the
         notch and the home indicator with env(safe-area-inset-*), which is
         the difference between a header under the clock and one below it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>SPCL Database</title>

    <!-- Added to the home screen, /tech opens without browser chrome and
         looks like an app. Safari reads these three; Chrome and Android read
         the manifest. Both point at the same start_url. -->
    <link rel="manifest" href="/technician.webmanifest" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SPCL Field" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b1c2d" />

    <!-- Inter is the UI font; Material Symbols supplies the icon ligatures. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
  rel="stylesheet"
/>

<link
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
  rel="stylesheet"
/>

  </head>
  <body>
    <!-- React mounts the complete application into this single root element. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
