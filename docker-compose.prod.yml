 # SPCL production stack for the TerraMaster NAS.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# PostgreSQL is published on the NAS's loopback address only. The API reaches
# it over the private Docker network; a GUI client reaches it through an SSH
# tunnel. Nothing on the office LAN, and nothing on the internet, can see it.

name: spcl-production

services:
  postgres:
    image: postgres:17-alpine
    container_name: spcl-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Jamaica
      PGTZ: America/Jamaica

    volumes:
      - ${SPCL_DATA_ROOT}/postgres-data:/var/lib/postgresql/data

    # Bound to the NAS's own loopback, NOT to the LAN. Only something already
    # logged into the NAS can connect - in practice, an SSH tunnel over
    # Tailscale from a laptop. Keep the 127.0.0.1 prefix: writing this as
    # "5432:5432" would hand the database to every machine in every office.
    ports:
      - "127.0.0.1:${SPCL_PG_PORT:-5432}:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - spcl

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: spcl-app:latest
    container_name: spcl-api
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      TZ: America/Jamaica

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

      SESSION_SECRET: ${SESSION_SECRET}

      # Gmail API credentials are generated once with
      # `npm run authorize:gmail` and kept only in .env.production on the NAS.
      # Receipt email uses the spc@fywycable.com mailbox and its send-as alias.
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
      GMAIL_SENDER_ADDRESS: ${GMAIL_SENDER_ADDRESS:-receipts@fywycable.com}
      GMAIL_SENDER_NAME: ${GMAIL_SENDER_NAME:-SPCL/FYWY Cable - Do Not Reply}

      # Reminders use their own licensed Workspace mailbox and refresh token,
      # keeping reminder traffic and replies out of the receipt mailbox.
      REMINDER_GMAIL_CLIENT_ID: ${REMINDER_GMAIL_CLIENT_ID:-}
      REMINDER_GMAIL_CLIENT_SECRET: ${REMINDER_GMAIL_CLIENT_SECRET:-}
      REMINDER_GMAIL_REFRESH_TOKEN: ${REMINDER_GMAIL_REFRESH_TOKEN:-}
      REMINDER_GMAIL_SENDER_ADDRESS: ${REMINDER_GMAIL_SENDER_ADDRESS:-notifications@fywycable.com}
      REMINDER_GMAIL_SENDER_NAME: ${REMINDER_GMAIL_SENDER_NAME:-SPCL/FYWY Cable - Do Not Reply}

      # Daily five-day disconnection warnings. Delivery is intentionally paced
      # so counter receipts continue to use Gmail immediately.
      EMAIL_REMINDERS_ENABLED: ${EMAIL_REMINDERS_ENABLED:-false}
      EMAIL_REMINDERS_START_DATE: ${EMAIL_REMINDERS_START_DATE:-}
      EMAIL_REMINDERS_HOUR: ${EMAIL_REMINDERS_HOUR:-8}
      EMAIL_REMINDERS_MINUTE: ${EMAIL_REMINDERS_MINUTE:-0}
      EMAIL_REMINDERS_BATCH_SIZE: ${EMAIL_REMINDERS_BATCH_SIZE:-20}
      EMAIL_REMINDERS_DAILY_LIMIT: ${EMAIL_REMINDERS_DAILY_LIMIT:-1500}
      EMAIL_REMINDERS_MAX_ATTEMPTS: ${EMAIL_REMINDERS_MAX_ATTEMPTS:-3}

      # Private per-OLT SSH credentials and pinned host fingerprints used only
      # by the backend's OLT actions. Writes remain off unless BOTH the global
      # switch and a comma-separated test-customer allowlist are configured.
      HUAWEI_OLT_CONNECTIONS_JSON: ${HUAWEI_OLT_CONNECTIONS_JSON:-}
      HUAWEI_OLT_WRITES_ENABLED: ${HUAWEI_OLT_WRITES_ENABLED:-false}
      HUAWEI_OLT_WRITE_CUSTOMER_IDS: ${HUAWEI_OLT_WRITE_CUSTOMER_IDS:-}
      # Separate rollout gate for the normal account deactivate/reconnect flow.
      # Both values default closed and must be deliberately configured.
      HUAWEI_OLT_ACCOUNT_ACTIONS_ENABLED: ${HUAWEI_OLT_ACCOUNT_ACTIONS_ENABLED:-false}
      HUAWEI_OLT_ACCOUNT_ACTION_CUSTOMER_IDS: ${HUAWEI_OLT_ACCOUNT_ACTION_CUSTOMER_IDS:-}
      # Fully cleared pending accounts may be verified and reactivated without
      # a staff confirmation. The normal account-action gate still applies.
      HUAWEI_OLT_RECONNECTION_AUTOMATION_ENABLED: ${HUAWEI_OLT_RECONNECTION_AUTOMATION_ENABLED:-false}
      HUAWEI_OLT_RECONNECTION_AUTOMATION_MAX_PER_TICK: ${HUAWEI_OLT_RECONNECTION_AUTOMATION_MAX_PER_TICK:-10}
      # Automatic disconnection of the billing-eligible delinquent list.
      HUAWEI_OLT_AUTOMATION_ENABLED: ${HUAWEI_OLT_AUTOMATION_ENABLED:-false}
      HUAWEI_OLT_AUTOMATION_HOUR: ${HUAWEI_OLT_AUTOMATION_HOUR:-9}
      HUAWEI_OLT_AUTOMATION_MINUTE: ${HUAWEI_OLT_AUTOMATION_MINUTE:-0}
      HUAWEI_OLT_AUTOMATION_MAX_PER_RUN: ${HUAWEI_OLT_AUTOMATION_MAX_PER_RUN:-300}
      # Comma-separated YYYY-MM-DD dates for one-off holidays declared by Gazette.
      HUAWEI_OLT_AUTOMATION_ADDITIONAL_HOLIDAYS: ${HUAWEI_OLT_AUTOMATION_ADDITIONAL_HOLIDAYS:-}
      # One global Huawei `save` per affected OLT, this many minutes after a
      # completed run. The durable job survives an API/container restart.
      HUAWEI_OLT_AUTOMATION_SAVE_DELAY_MINUTES: ${HUAWEI_OLT_AUTOMATION_SAVE_DELAY_MINUTES:-120}

      # auto | true | false. "auto" decides per request, so branch offices
      # arriving over HTTPS through the tunnel get a protected cookie while
      # the home office on the plain-HTTP LAN address keeps working. Only move
      # to "true" once every office reaches the app over HTTPS: a Secure
      # cookie sent over HTTP is dropped by the browser, and those staff can
      # no longer log in.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-auto}

    ports:
      - "${SPCL_HTTP_PORT:-8090}:3000"

    networks:
      - spcl

  backup:
    image: postgres:17-alpine
    container_name: spcl-backup
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      TZ: America/Jamaica

      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      DAILY_RETENTION_DAYS: ${DAILY_RETENTION_DAYS:-30}
      MONTHLY_RETENTION_MONTHS: ${MONTHLY_RETENTION_MONTHS:-12}

    volumes:
      - ${SPCL_DATA_ROOT}/database-backups:/backups
      - ./deploy:/opt/spcl-deploy:ro

      # Read-only so this container can apply migrations and one-off SQL, but
      # can never write back into the repository.
      - ./database:/opt/spcl-database:ro

    entrypoint: ["/bin/sh", "/opt/spcl-deploy/backup-loop.sh"]

    networks:
      - spcl

  # Remote access for the branch offices.
  #
  # Opt-in, because the LAN-only deployment must keep working without it:
  #   docker-compose -f docker-compose.prod.yml --env-file .env.production \
  #     --profile remote up -d
  #
  # cloudflared makes an OUTBOUND connection to Cloudflare. Nothing is exposed
  # on the router, no ports are forwarded, and the NAS stays unreachable from
  # the internet. Routing and access rules live in the Cloudflare dashboard.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: spcl-cloudflared
    restart: unless-stopped

    profiles:
      - remote

    depends_on:
      - api

    environment:
      TZ: America/Jamaica

    # The token identifies this tunnel. It is a secret - it lives in
    # .env.production, never in the repository.
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}

    networks:
      - spcl

networks:
  spcl:
    driver: bridge
